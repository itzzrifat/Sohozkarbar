<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Invoice — Sohoz Karbar</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#dbeafe,transparent 30%),#f1f5f9;color:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:860px;margin:0 auto;padding:28px 16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.top img{width:54px;height:54px;border-radius:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.12)}.head{padding:22px 25px;background:linear-gradient(135deg,#052e16,#059669);color:#fff;display:flex;justify-content:space-between;gap:15px}.badge{background:#dcfce7;color:#15803d;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:900}.body{padding:23px 25px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.fact{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:11px}.fact small{display:block;color:#64748b;font-size:10px}.fact b{display:block;margin-top:4px}.items{width:100%;border-collapse:collapse;font-size:13px}.items th{background:#0f172a;color:#fff;padding:9px;text-align:left}.items td{padding:9px;border-bottom:1px solid #e2e8f0}.num{text-align:right}.tot{margin:17px 0 0 auto;width:min(320px,100%);border:1px solid #e2e8f0;border-radius:13px;overflow:hidden}.tot div{display:flex;justify-content:space-between;padding:8px 12px}.tot .grand{background:#0f172a;color:#fff;font-weight:900}.foot{padding:14px 25px;background:#f8fafc;color:#64748b;font-size:11px;text-align:center}.err{padding:35px;text-align:center;color:#b91c1c}@media(max-width:620px){.facts{grid-template-columns:1fr}.head{flex-direction:column}.body{padding:16px}.items{font-size:11px}.items th,.items td{padding:7px}}</style><script src="/app-updater.js?v=1787291000000" defer></script>

</head><body><div class="wrap"><div class="top"><img src="/logo-square.png"><div><b style="font-size:19px">Sohoz Karbar</b><div style="font-size:12px;color:#64748b">Central Invoice Verification</div></div></div><div class="card" id="app"><div style="padding:45px;text-align:center">Verifying central record…</div></div></div><script>(function(){var API='AIzaSyC0Mmh2vN77NxKaxTFOW531fc-ZXBrZK6Y',token=String(location.hash||'').slice(1).replace(/[^a-f0-9]/gi,''),app=document.getElementById('app');function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function money(n,p){return e(p.symbol||p.currency||'')+' '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}if(!token){app.innerHTML='<div class="err"><h2>Invalid verification link</h2><p>No invoice token was supplied.</p></div>';return}var url='https://firestore.googleapis.com/v1/projects/karbarnew/databases/(default)/documents/license_customers/'+encodeURIComponent('_invoice_verify_'+token)+'?key='+API;fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('not-found');return r.json()}).then(function(doc){var p=JSON.parse(doc.fields.payloadJson.stringValue),rows=(p.items||[]).map(function(x,i){return'<tr><td>'+(i+1)+'</td><td><b>'+e(x.name)+'</b><br><small>'+e(x.sku||'')+'</small></td><td class="num">'+e(x.qty)+' '+e(x.unit)+'</td><td class="num">'+money(x.total,p)+'</td></tr>'}).join('');app.innerHTML='<div class="head"><div><div style="font-size:11px;opacity:.75">'+e(p.mode||'')+' • '+e(p.currency||'')+'</div><h1 style="margin:4px 0">'+e(p.companyName||'Verified Invoice')+'</h1><div>'+e(p.companyAddress||'')+'</div></div><div style="text-align:right"><span class="badge">✓ CENTRAL RECORD FOUND</span><div style="margin-top:10px;font-weight:900"># '+e(p.invoiceNo)+'</div></div></div><div class="body"><div class="facts"><div class="fact"><small>Customer</small><b>'+e(p.customerName)+'</b></div><div class="fact"><small>Invoice Date</small><b>'+new Date(p.date).toLocaleDateString()+'</b></div><div class="fact"><small>Status</small><b>'+e(String(p.status||'').toUpperCase())+'</b></div></div><table class="items"><thead><tr><th>#</th><th>Item</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead><tbody>'+rows+'</tbody></table><div class="tot"><div><span>Subtotal</span><span>'+money(p.subtotal,p)+'</span></div><div><span>VAT / Tax</span><span>'+money(p.vat,p)+'</span></div><div class="grand"><span>Total</span><span>'+money(p.total,p)+'</span></div><div><span>Paid</span><span>'+money(p.paid,p)+'</span></div><div><b>Due</b><b>'+money(p.due,p)+'</b></div></div></div><div class="foot">Published from Sohoz Karbar ERP central verification record • '+new Date(p.publishedAt).toLocaleString()+'</div>'}).catch(function(){app.innerHTML='<div class="err"><h2>Invoice not found</h2><p>This verification link is invalid, expired, or the invoice has not been published yet.</p></div>'})})();</script><script src="/sk-views.js?v=1788370000000" defer></script>
</body></html>
