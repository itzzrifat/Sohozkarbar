<script>
(function(){
'use strict';
const KEY='AIzaSyC0Mmh2vN77NxKaxTFOW531fc-ZXBrZK6Y';
const PID='karbarnew';
const t=new URLSearchParams(location.search).get('t')||'';
const grid=document.getElementById('grid'), chips=document.getElementById('chips'), q=document.getElementById('q');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let DATA=[],PHONE='',BIZ='Our Shop',CAT='';
if(!t){grid.innerHTML='<div class="empty">⚠️ This link is not valid — please ask the shopkeeper for a fresh link</div>';return;}
fetch('https://firestore.googleapis.com/v1/projects/'+PID+'/databases/(default)/documents/license_customers/catalog_'+encodeURIComponent(t)+'?key='+KEY)
.then(r=>{if(!r.ok)throw new Error('x');return r.json();})
.then(d=>{
  const f=d.fields||{};
  BIZ=(f.businessName&&f.businessName.stringValue)||BIZ;
  PHONE=(f.phone&&f.phone.stringValue)||'';
  document.getElementById('biz').textContent='🛍️ '+BIZ;
  document.title=BIZ+' — Online Catalog';
  const up=(f.updatedAt&&f.updatedAt.stringValue);
  if(up){const dt=new Date(up);if(!isNaN(dt))document.getElementById('upd').textContent='Updated: '+dt.toLocaleDateString('en-GB');}
  DATA=JSON.parse((f.data&&f.data.stringValue)||'[]');
  paintChips();paint();
})
.catch(()=>{grid.innerHTML='<div class="empty">😔 The catalog cannot be opened right now — please ask the shopkeeper to publish it again</div>';});
function cats(){const s=[];DATA.forEach(p=>{if(p.c&&s.indexOf(p.c)<0)s.push(p.c);});return s;}
function paintChips(){
  const cs=cats();if(!cs.length){chips.style.display='none';return;}
  chips.innerHTML='<button class="chip on" data-c="">All</button>'+cs.map(c=>'<button class="chip" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
  chips.querySelectorAll('.chip').forEach(b=>{b.onclick=()=>{chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');CAT=b.dataset.c;paint();};});
}
function filtered(){
  let a=DATA;
  if(CAT)a=a.filter(p=>p.c===CAT);
  const s=(q.value||'').trim().toLowerCase();
  if(s.length>=1){
    if(window.Fuse){a=new Fuse(a,{keys:['n','c'],threshold:0.38,ignoreLocation:true}).search(s).map(r=>r.item);}
    else a=a.filter(p=>(p.n||'').toLowerCase().includes(s));
  }
  return a;
}
function orderWa(p){
  const txt='🛒 *New Order — from Catalog*\n\n📦 Product: '+p.n+(p.c?'\n🗂️ Category: '+p.c:'')+'\n💰 Price: ৳'+Number(p.p||0).toLocaleString('en-IN')+'\n🔢 Qty: \n\n— sent from '+BIZ+' catalog';
  const ph=(PHONE||'').replace(/[^0-9]/g,'');
  const url=ph?('https://wa.me/'+ph+'?text='+encodeURIComponent(txt)):('https://wa.me/?text='+encodeURIComponent(txt));
  window.open(url,'_blank');
}
function paint(){
  const a=filtered();
  if(!a.length){grid.innerHTML='<div class="empty">🤷 "'+esc(q.value)+'"" — nothing matched</div>';return;}
  grid.innerHTML=a.map(p=>{
    const img=p.i&&p.t?('<img class="pimg" loading="lazy" src="'+p.t+'" alt="">').replace('"pimg"','"pimg"'):'<div class="pimg">🛍️</div>';
    return '<div class="card">'+img
      +'<div class="pbody"><div class="pname">'+esc(p.n)+'</div>'
      +(p.c?'<span class="pcat">'+esc(p.c)+'</span>':'')
      +'<div class="pprice">৳'+Number(p.p||0).toLocaleString('en-IN')+' <small>/ pc</small></div>'
      +'<button class="ord" data-n="'+esc(p.n)+'">🛒 Order on WhatsApp</button></div></div>';
  }).join('');
  grid.querySelectorAll('.ord').forEach(b=>{b.onclick=()=>{const p=a.find(x=>x.n===b.dataset.n)||a[0];orderWa(p);};});
}
q.addEventListener('input',paint);
})();
</script>



<script>
/* ===== NX UPDATE 98 — COMMON CORE (https-force + errwatch + marketing) ===== */
(function(){
'use strict';
if(window.__nxCommon98) return; window.__nxCommon98=1;

/* [5] HTTPS FORCE — http e khulle https e pathay (localhost/deploy preview badh) */
try{
  var h=location.hostname;

}catch(e){}

/* Firestore REST base (rules: ey path open — broadcast/publish ager motoi) */
var NXF='https://firestore.googleapis.com/v1/projects/karbarnew/databases/(default)/documents';
window.__nxFBase=NXF;
var NXAPIKEY='AIzaSyC0Mmh2vN77NxKaxTFOW531fc-ZXBrZK6Y';
var _nxAuthP=null;
/* anon token lazily — rules harden korle private docs o kaj kore, open docs e sudhu 1st call addat */
function nxToken(){
  if(_nxAuthP) return _nxAuthP;
  _nxAuthP=fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+NXAPIKEY,{
    method:'POST', headers:{'Content-Type':'application/json'}, body:'{"returnSecureToken":true}'
  }).then(function(r){return r.ok?r.json():null;}).then(function(d){return (d&&d.idToken)||null;})
   .catch(function(){ _nxAuthP=null; return null; });
  return _nxAuthP;
}
function nxSend(method, url, bodyObj, useAuth){
  function go(tok){
    var h={'Content-Type':'application/json'};
    if(tok) h['Authorization']='Bearer '+tok;
    return fetch(url,{method:method,headers:h,body:bodyObj?JSON.stringify(bodyObj):undefined});
  }
  if(useAuth){
    return nxToken().then(go).then(function(r){return r;}).catch(function(){return {ok:false};});
  }
  return go(null).then(function(r){
    if(r.status===401||r.status===403){ return nxToken().then(go); } /* opene blocked hole anon diye retry */
    return r;
  }).catch(function(){return {ok:false};});
}
function nxVal(f){
  if(f==null) return '';
  if(typeof f!=='object') return f;
  if(f.stringValue!=null) return f.stringValue;
  if(f.integerValue!=null) return Number(f.integerValue);
  if(f.doubleValue!=null) return f.doubleValue;
  if(f.booleanValue!=null) return !!f.booleanValue;
  return '';
}
window.__nxVal=nxVal;
function nxDocGet(id){
  return nxSend('GET', NXF+'/license_customers/'+encodeURIComponent(id))
    .then(function(r){return r.ok?r.json():null;});}
window.__nxDocGet=nxDocGet;
function nxDocPatch(id, fieldsObj){
  var mask=Object.keys(fieldsObj).map(function(k){return 'updateMask.fieldPaths='+encodeURIComponent(k);}).join('&');
  return nxSend('PATCH', NXF+'/license_customers/'+encodeURIComponent(id)+'?'+mask, {fields:fieldsObj})
    .then(function(r){return r.ok;});
}
window.__nxDocPatch=nxDocPatch;
function nxDocCreate(id, fieldsObj){
  return nxSend('POST', NXF+'/license_customers?documentId='+encodeURIComponent(id), {fields:fieldsObj})
    .then(function(r){return r.ok;});
}
window.__nxDocCreate=nxDocCreate;

/* [8] NX ERROR WATCH — silent runtime error tracker (Firestore e batch send) */
try{
  if(!window.__nxErrWatch){
    window.__nxErrWatch=1;
    var _q=[], _seen={};
    function push(m,s){
      try{
        m=String(m==null?'':m).slice(0,260);
        if(!m || m==='[object Object]') m=String((s||'')+' rejection').slice(0,260);
        var k=m.slice(0,90); if(_seen[k]) return; _seen[k]=1;
        _q.push({m:m,s:String(s||'').slice(0,140),t:Date.now(),pg:location.pathname.slice(0,30)});
      }catch(e){}
    }
    window.addEventListener('error', function(ev){
      if(ev && ev.message) push(ev.message, (ev.filename||'').split('/').pop()+':'+(ev.lineno||''));
    }, true);
    window.addEventListener('unhandledrejection', function(ev){
      var r=ev && ev.reason; push(r && (r.message||r.code||r), 'promise');
    });
    function dayKey(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
    function flush(){
      if(!_q.length) return;
      var batch=_q.splice(0,4);
      var id='nx_errors_'+dayKey(new Date());
      nxDocGet(id).then(function(d){
        var items=[], count=0;
        if(d && d.fields){
          count=Number(nxVal(d.fields.count)||0);
          var arr=d.fields.items && d.fields.items.arrayValue && d.fields.items.arrayValue.values || [];
          items=arr.map(function(v){
            var f=v.mapValue&&v.mapValue.fields||{};
            return {m:nxVal(f.m),s:nxVal(f.s),t:nxVal(f.t),pg:nxVal(f.pg)};
          });
        }
        batch.forEach(function(b){ items.push(b); count++; });
        if(items.length>40) items=items.slice(items.length-40);
        var body={fields:{
          count:{integerValue:String(count)},
          updatedAt:{integerValue:String(Date.now())},
          items:{arrayValue:{values:items.map(function(b){return {mapValue:{fields:{
            m:{stringValue:String(b.m).slice(0,260)}, s:{stringValue:String(b.s||'').slice(0,140)},
            t:{integerValue:String(b.t||Date.now())}, pg:{stringValue:String(b.pg||'')}}}};})}}
        }};
        fetch(NXF+'/license_customers/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){});
      });
    }
    setInterval(flush, 45000);
    setTimeout(flush, 12000);
    document.addEventListener('visibilitychange', function(){ if(document.hidden) flush(); });
  }
}catch(e){}

/* [1] MARKETING LOADER — central config (_nx_marketing) theke FB Pixel + GA4
   Rifat admin e ID boshalei shob page-e auto chole ashe (code change lagen a) */
function nxLoadMarketing(cb){
  return nxDocGet('_nx_marketing').then(function(d){
    var f=(d&&d.fields)||{};
    var mk={ fb:nxVal(f.fbPixelId), ga:nxVal(f.gaId),
             bkash:nxVal(f.bkash)||'01625-914562', nagad:nxVal(f.nagad)||'01625-914562',
             wa:nxVal(f.wa)||'8801625914562' };
    window.__nxMk=mk;
    try{
      if(mk.fb && !window.fbq){
        var n=window.fbq=function(){ n.queue.push(arguments); };
        n.queue=[]; n.version='2.0'; n.loaded=true;
        var s=document.createElement('script'); s.async=1;
        s.src='https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(s);
        window.fbq('init', mk.fb); window.fbq('track','PageView');
      }
      if(mk.ga && !window.gtag){
        var g=document.createElement('script'); g.async=1;
        g.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(mk.ga);
        document.head.appendChild(g);
        window.dataLayer=window.dataLayer||[];
        window.gtag=function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date()); window.gtag('config', mk.ga);
      }
    }catch(e){}
    if(cb) cb(mk);
    return mk;
  });
}
window.__nxLoadMarketing = window.__nxLoadMarketing || nxLoadMarketing;
function nxEv(name, std){
  try{ if(window.fbq){ window.fbq(std?'track':'trackCustom', name); } }catch(e){}
  try{ if(window.gtag){ window.gtag('event', name); } }catch(e){}
}
window.__nxEv=nxEv;
nxLoadMarketing();
})();
